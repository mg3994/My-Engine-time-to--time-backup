<!DOCTYPE html>
<html>
<head>
    <title>Blogger Test</title>
    <style>
        :root { --accent: #e67e22; --text: #333; --card: #fff; --bg: #f8f9fa; }
        .hidden { display: none !important; }
        .active { display: block !important; }
        .cart-fab { position: fixed; bottom: 20px; right: 20px; width: 50px; height: 50px; background: orange; border-radius: 50%; }
        .cart-count { background: red; color: white; border-radius: 50%; padding: 2px 6px; }
        .cart-drawer { position: fixed; right: -400px; top: 0; width: 300px; height: 100%; background: white; transition: right 0.3s; z-index: 5000; }
        .cart-drawer.active { right: 0; }
        .modal-backdrop { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; z-index: 4000; }
        .modal-backdrop.active { display: block; }
        .h-card { border: 1px solid #ddd; padding: 15px; margin-bottom: 10px; border-radius: 8px; }
        .v-btn { background: #e67e22; color: #fff; border: none; padding: 10px; cursor: pointer; border-radius: 5px; }
    </style>
</head>
<body>
    <div id="initializing-state">Loading...</div>
    <div id="carousel-section" class="hidden">
        <div id="carousel-inner"></div>
        <div id="thumbnail-row"></div>
    </div>
    <div id="details-section" class="hidden">
        <h1 id="p-name"></h1>
        <p id="p-desc"></p>
        <div id="p-price"></div>
        <div id="stock-badge-container"></div>
        <div id="p-variants"></div>
        <div id="p-specs"><div id="specs-list"></div></div>
        <div class="qty-controls">
            <button id="qty-minus">-</button>
            <span id="qty-val">1</span>
            <button id="qty-plus">+</button>
        </div>
        <button id="add-to-cart-btn">Add to Cart</button>
    </div>

    <div id="p-seller" style="display:none;">
        <div id="seller-info"></div>
        <a id="maps-link" href="#">Map</a>
    </div>

    <div id="product-addons" style="display:none;">
        <h3 class="section-title">Product Add-ons</h3>
        <div id="product-addons-list"></div>
    </div>

    <div id="other-services" style="display:none;">
        <h3 class="section-title">Other Services</h3>
        <div id="other-services-list"></div>
    </div>

    <div id="cart-fab-container"></div>
    <div id="cart-modal-backdrop" class="cart-backdrop modal-backdrop"></div>
    <div id="cart-drawer" class="cart-drawer">
        <div class="cart-header"><h3>Bag</h3></div>
        <div id="cart-items-list" class="cart-body"></div>
        <div class="cart-footer">
            <div id="cart-total-price"></div>
            <button id="cart-confirm-btn">Confirm Order</button>
        </div>
    </div>

    <div id="loc-modal-backdrop" class="modal-backdrop">
        <div class="modal-content">
            <button class="loc-btn" onclick="window.LocationRenderer.hideModal()">Close</button>
        </div>
    </div>
    <input id="loc-display-v2" />

    <div id="post-body-raw" class="hidden">
        <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "ProductGroup",
          "name": "Elite Crewneck Collection",
          "description": "Premium organic cotton collection.",
          "productGroupID": "elite-crew-series",
          "aggregateRating": {
            "@type": "AggregateRating",
            "ratingValue": "4.8",
            "reviewCount": "124"
          },
          "review": [
            {
              "@type": "Review",
              "author": { "@type": "Person", "name": "Jane Doe" },
              "reviewBody": "Excellent quality!",
              "reviewRating": { "@type": "Rating", "ratingValue": "5" },
              "datePublished": "2024-01-15"
            }
          ],
          "variesBy": ["size"],
          "hasVariant": [
            {
              "@type": "Product",
              "name": "Elite Crewneck - Midnight Blue (Large)",
              "sku": "EC-MB-L-001",
              "size": "Large",
              "offers": {
                "@type": "Offer",
                "price": "38851.00",
                "priceCurrency": "INR",
                "availability": "https://schema.org/InStock"
              },
              "addOn": [
                {
                  "@type": "Offer",
                  "price": "499.00",
                  "priceCurrency": "INR",
                  "eligibleQuantity": { "@type": "QuantitativeValue", "minValue": 1, "maxValue": 3 },
                  "itemOffered": {
                    "@type": "Service",
                    "name": "Premium Gift Wrapping"
                  }
                }
              ]
            }
          ]
        }
        </script>
    </div>

    <script src="dist/antinna-engine.iife.js"></script>
</body>
</html>
